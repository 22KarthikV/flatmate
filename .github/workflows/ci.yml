name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0" # no git hooks in CI

jobs:
  check:
    name: Lint, types, unit tests, build, bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle

  database:
    name: Database (migrations, pgTAP, types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only the services the checks need: skips Studio, image proxy, mail, logs and analytics.
      - run: pnpm exec supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor
      - name: Rebuild the database from migrations only
        run: pnpm exec supabase db reset
      - name: Database tests (pgTAP)
        run: pnpm exec supabase test db
      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code src/lib/db/types.ts

  e2e:
    name: End-to-end (Chromium and WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      # /api/health checks the database and the tests sign in, so they use a real local Supabase.
      - uses: ./.github/actions/local-supabase
      # Account deletion calls the delete-account Edge Function, so serve the functions too.
      - name: Serve Edge Functions
        run: |
          nohup pnpm exec supabase functions serve > functions.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$NEXT_PUBLIC_SUPABASE_URL/functions/v1/delete-account" || true)
            [ "$code" = "401" ] && exit 0
            sleep 3
          done
          cat functions.log
          exit 1
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Signed-in pages need a session, and the build bakes the Supabase address into the app.
      - uses: ./.github/actions/local-supabase
      - run: pnpm build
      - run: pnpm exec lhci autorun
      - run: node scripts/lighthouse-app.mts
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
